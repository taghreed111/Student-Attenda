function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sv(){try{localStorage.setItem('r',JSON.stringify(R));localStorage.setItem('a',JSON.stringify(A))}catch(e){}}
let R=ld('r');if(!R){R={};L.forEach(c=>R[c[0]]=c[1].trim().split("\n"))}
let A=ld('a')||{},cls=L[0][0],edit=false;
const $=id=>document.getElementById(id),dt=$('d');
const t=new Date();dt.value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,0)+'-'+String(t.getDate()).padStart(2,0);
dt.onchange=()=>render();
const rec=c=>{const k=dt.value+'|'+c;return A[k]||(A[k]={m:{},ok:0})};
const cnt=c=>{const r=rec(c);let p=0,a=0;R[c].forEach(n=>{if(r.m[n]===1)p++;else if(r.m[n]===0)a++});return[p,a]};
const pc=(x,y)=>y?Math.round(x/y*100)+'%':'-';
function render(){
$('tabs').innerHTML=L.map(c=>`<button class="t ${c[0]==cls?'on':''}" data-c="${c[0]}">${c[0]}${rec(c[0]).ok?' ✓':''}</button>`).join('')+`<button class="t ${cls=='*'?'on':''}" data-c="*">📊 الملخص</button>`;
let h='';
if(cls=='*'){let tp=0,ta=0;
h='<table><tr><th>الفصل</th><th>حضور</th><th>غياب</th><th>% حضور</th><th>% غياب</th></tr>'+L.map(c=>{const r=rec(c[0]);if(!r.ok)return`<tr><td>${c[0]}</td><td colspan=4 class=n>لم يُعتمد</td></tr>`;const[p,a]=cnt(c[0]);tp+=p;ta+=a;return`<tr><td>${c[0]}</td><td>${p}</td><td>${a}</td><td>${pc(p,p+a)}</td><td>${pc(a,p+a)}</td></tr>`}).join('')+`<tfoot><tr><td>الإجمالي</td><td>${tp}</td><td>${ta}</td><td>${pc(tp,tp+ta)}</td><td>${pc(ta,tp+ta)}</td></tr></tfoot></table><p class=n style="text-align:center">الإجمالي يشمل الفصول المعتمدة فقط لتاريخ اليوم المحدد</p>`;
}else{const r=rec(cls),[p,a]=cnt(cls),n=R[cls].length;
h=`<div class=cnt><div><b style="color:#1f9d57">${p}</b>حاضر</div><div><b style="color:#d6403f">${a}</b>غائب</div><div><b>${n-p-a}</b>لم يُرصد</div></div>`;
h+=r.ok?`<div class=ok>✓ تم اعتماد الحضور</div><button class="act l" data-act=un>تعديل الحضور</button>`:`<button class="act l" data-act=all>الكل حاضر</button>`;
h+=R[cls].map((n,i)=>{const m=r.m[n];return`<div class=s><span>${i+1}. ${n}</span><button class="b ${m===1?'p':''}" data-act=p data-i=${i}>حاضر</button><button class="b ${m===0?'a':''}" data-act=a data-i=${i}>غائب</button>${edit?`<button class=b data-act=del data-i=${i}>✕</button>`:''}</div>`}).join('');
if(!r.ok)h+=`<button class="act g" data-act=ok>اعتماد الحضور والغياب</button>`;
h+=`<button class="act l" data-act=ed>${edit?'إنهاء إدارة الطلاب':'إدارة الطلاب (إضافة / حذف)'}</button>`;
if(edit)h+=`<input class=add id=nn placeholder="اسم الطالب الجديد ثم اضغطي إضافة"><button class=act data-act=add>إضافة</button>`}
$('app').innerHTML=h}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.c){cls=b.dataset.c;edit=false;render();scrollTo(0,0);return}
const x=b.dataset.act;if(!x)return;const r=cls!='*'&&rec(cls),i=b.dataset.i;
if(x=='p'||x=='a'){if(r.ok)return;const n=R[cls][i];r.m[n]=r.m[n]===(x=='p'?1:0)?undefined:(x=='p'?1:0)}
if(x=='all')R[cls].forEach(n=>{if(r.m[n]===undefined)r.m[n]=1});
if(x=='un')r.ok=0;
if(x=='ok'){const[p,a]=cnt(cls),u=R[cls].length-p-a;if(u&&!confirm(u+' طالب لم يُرصدوا وسيُحسبون غياب. متابعة؟'))return;R[cls].forEach(n=>{if(r.m[n]===undefined)r.m[n]=0});r.ok=1;cls='*'}
if(x=='ed')edit=!edit;
if(x=='del'&&confirm('حذف '+R[cls][i]+'؟'))R[cls].splice(i,1);
if(x=='add'){const v=$('nn').value.trim();if(v)R[cls].push(v)}
sv();render()});
